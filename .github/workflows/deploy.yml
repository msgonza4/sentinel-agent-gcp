name: Global Sentinel Handshake

on:
  push:
    branches: [ "main" ]

jobs:
  handshake-test:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/330110560042/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'sentinel-bot@uiw-sentinel-agent.iam.gserviceaccount.com'

      - name: Verify Cloud Connection
        run: 'gcloud info'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
           pip install google-cloud-firestore google-auth

      - name: Run Sentinel Agent
        run: |
          python main.py
